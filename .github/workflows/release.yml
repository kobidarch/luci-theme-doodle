name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build packages
        env:
          APK_SEC_KEY: ${{ secrets.APK_SEC_KEY }}
        run: |
          rm -f dist/*
          # Provide the APK signing key to build-pkg.sh (skipped if secret unset)
          if [ -n "$APK_SEC_KEY" ]; then
            echo "$APK_SEC_KEY" > /tmp/doodle-apk.rsa
            chmod 600 /tmp/doodle-apk.rsa
            export APK_SIGN_KEY=/tmp/doodle-apk.rsa
          fi
          bash build-pkg.sh
          rm -f /tmp/doodle-apk.rsa

      - name: Extract version
        id: version
        run: |
          VER=$(tr -d '[:space:]' < ucode/template/themes/doodle/version)
          REL=$(grep -m1 '^PKG_RELEASE=' build-pkg.sh | tr -dc '0-9')
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "release=$REL" >> "$GITHUB_OUTPUT"
          echo "ipk=luci-theme-doodle_${VER}-${REL}_all.ipk" >> "$GITHUB_OUTPUT"
          echo "apk=luci-theme-doodle-${VER}-r${REL}.apk" >> "$GITHUB_OUTPUT"

      - name: Generate and sign opkg Packages index
        env:
          USIGN_SEC_KEY: ${{ secrets.USIGN_SEC_KEY }}
        run: |
          cd dist
          IPK="${{ steps.version.outputs.ipk }}"

          # Extract control info from IPK
          mkdir -p _tmp
          tar xzf "$IPK" -C _tmp ./control.tar.gz
          tar xzf _tmp/control.tar.gz -C _tmp ./control

          # Build Packages index
          cat _tmp/control > Packages
          echo "Filename: $IPK" >> Packages
          echo "Size: $(stat -c%s "$IPK")" >> Packages
          echo "SHA256sum: $(sha256sum "$IPK" | cut -d' ' -f1)" >> Packages
          echo "" >> Packages

          gzip -k Packages

          # Sign with usign key (signify-openbsd is compatible)
          # opkg verifies sig against the uncompressed Packages file saved to /var/opkg-lists/
          sudo apt-get install -y -qq signify-openbsd >/dev/null 2>&1
          echo "$USIGN_SEC_KEY" > _tmp/doodle.sec
          signify-openbsd -S -s _tmp/doodle.sec -m Packages -x Packages.sig
          echo "Packages signed successfully"
          cat Packages.sig

          rm -rf _tmp

      - name: Generate and sign apk packages.adb index
        env:
          APK_SEC_KEY: ${{ secrets.APK_SEC_KEY }}
        run: |
          APK="${{ steps.version.outputs.apk }}"
          mkdir -p dist/apk_staging
          cp "dist/$APK" dist/apk_staging/

          # Write RSA private key for the index step below
          echo "$APK_SEC_KEY" > dist/apk_staging/doodle-apk.rsa
          chmod 600 dist/apk_staging/doodle-apk.rsa

          # Generate and sign packages.adb. The repo's public keys are
          # mounted so apk verifies the packages while indexing
          # (mkndx refuses untrusted input).
          docker run --rm \
            -v "$PWD/dist/apk_staging:/repo" \
            -v "$PWD/root/etc/apk/keys:/keys:ro" \
            alpine:latest sh -c "
              cd /repo
              apk mkndx \
                --sign-key /repo/doodle-apk.rsa \
                --keys-dir /keys \
                -o packages.adb \
                *.apk 2>&1
            "

          # Remove private key from staging dir
          rm -f dist/apk_staging/doodle-apk.rsa

          ls -la dist/apk_staging/

      - name: Open feed publish PR
        # Serve the feed from the main branch (Pages builds the branch).
        # Past artifact deployments were accepted and green yet silently
        # never served — which broke apk/opkg update with no signal — so the
        # feed is published as a branch PR instead. Direct pushes to main
        # are PR-gated by the repo ruleset, hence a PR (not a push).
        # Merge it and the feed goes live on the next branch Pages build.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER="${{ steps.version.outputs.version }}"
          REL="${{ steps.version.outputs.release }}"
          IPK="${{ steps.version.outputs.ipk }}"
          APK="${{ steps.version.outputs.apk }}"
          BRANCH="feed/v${VER}-r${REL}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          rm -rf packages apk
          mkdir -p packages apk
          cp "dist/$IPK" dist/Packages dist/Packages.gz dist/Packages.sig packages/
          cp "dist/$APK" dist/apk_staging/packages.adb apk/
          ls -R packages apk
          git add packages apk
          git commit -m "Feed: publish v${VER}-r${REL} packages" || echo "nothing to commit"
          git push origin "$BRANCH" --force
          gh pr create --base main --head "$BRANCH" \
            --title "Feed: publish v${VER}-r${REL}" \
            --body "Signed feed files built from tag v${VER}. Merge to put the opkg/apk feed live." \
          || gh pr edit "$BRANCH" --title "Feed: publish v${VER}-r${REL}" \
               --body "Signed feed files built from tag v${VER}. Merge to put the opkg/apk feed live."

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER="${{ steps.version.outputs.version }}"
          REL="${{ steps.version.outputs.release }}"
          IPK="dist/${{ steps.version.outputs.ipk }}"
          APK="dist/${{ steps.version.outputs.apk }}"

          # Check if release already exists (preserve manually edited notes)
          if gh release view "v${VER}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v${VER} exists — uploading assets only (preserving notes)"
            gh release upload "v${VER}" "$IPK" "$APK" --clobber
          else
            echo "Creating new release v${VER}"
            # Extract notes from commit body
            git checkout "$GITHUB_SHA" -- 2>/dev/null || true
            BODY=$(git log -1 --format='%b' "$GITHUB_SHA" 2>/dev/null || echo "")

            cat > /tmp/release-notes.md <<NOTES_EOF
          ${BODY}

          ## Install

          ### From package repository (auto-update)

          **opkg (OpenWrt 24.10 and earlier):**
          \`\`\`sh
          # First install: fetch signing public key (one-time)
          wget -O /etc/opkg/keys/71a41001d24a5ce1 \
            https://raw.githubusercontent.com/kobidarch/luci-theme-doodle/main/root/etc/opkg/keys/71a41001d24a5ce1

          # Add feed and install
          echo "src/gz doodle https://kobidarch.github.io/luci-theme-doodle/packages" >> /etc/opkg/customfeeds.conf
          opkg update
          opkg install luci-theme-doodle
          \`\`\`

          **apk (OpenWrt 25.12+):**
          \`\`\`sh
          # First install: fetch signing public key (one-time)
          wget -O /etc/apk/keys/doodle-apk.pem \
            https://raw.githubusercontent.com/kobidarch/luci-theme-doodle/main/root/etc/apk/keys/doodle-apk.pem

          # Add feed and install
          echo "https://kobidarch.github.io/luci-theme-doodle/apk/packages.adb" >> /etc/apk/repositories.d/customfeeds.list
          apk update
          apk add luci-theme-doodle
          \`\`\`

          ### From release (manual)
          - **apk**: \`apk add --allow-untrusted luci-theme-doodle-${VER}-r${REL}.apk\`
          - **opkg**: \`opkg install luci-theme-doodle_${VER}-${REL}_all.ipk\`
          NOTES_EOF

            gh release create "v${VER}" "$IPK" "$APK" \
              --title "v${VER}" \
              --notes-file /tmp/release-notes.md
          fi
